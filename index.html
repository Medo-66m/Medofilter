<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Medo Number Cleaner</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.16), transparent 30%),
        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.14), transparent 35%),
        linear-gradient(135deg, #020617, #0f172a);
      color: #e5e7eb;
      padding: 18px;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 28px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(18px);
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.25);
      font-size: 13px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: -1px;
      line-height: 1.15;
    }

    .subtitle {
      color: #94a3b8;
      margin: 12px auto 0;
      line-height: 1.8;
      font-size: 15px;
      max-width: 680px;
    }

    .layout {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 20px;
      align-items: stretch;
    }

    .left-panel,
    .right-panel {
      background: rgba(2, 6, 23, 0.35);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 22px;
      padding: 18px;
    }

    .drop-zone {
      min-height: 250px;
      border: 2px dashed rgba(148, 163, 184, 0.35);
      border-radius: 22px;
      padding: 28px 18px;
      text-align: center;
      background: rgba(2, 6, 23, 0.45);
      transition: 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.08);
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 46px;
      margin-bottom: 12px;
    }

    .drop-zone p {
      margin: 6px 0;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
    }

    input[type="file"] {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .stat {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #f8fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stat span {
      color: #94a3b8;
      font-size: 13px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 14px 16px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      color: #020617;
      background: #22c55e;
      transition: 0.18s;
      min-height: 48px;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.danger {
      background: #ef4444;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    textarea {
      width: 100%;
      min-height: 390px;
      resize: vertical;
      background: #020617;
      color: #d1fae5;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 16px;
      outline: none;
      line-height: 1.65;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    textarea:focus {
      border-color: rgba(34, 197, 94, 0.6);
    }

    .status {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      min-height: 24px;
    }

    .footer {
      text-align: center;
      color: #86efac;
      font-size: 13px;
      margin-top: 18px;
      letter-spacing: 1px;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      .page {
        align-items: flex-start;
        padding-top: 10px;
      }

      .container {
        padding: 20px;
        border-radius: 24px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .drop-zone {
        min-height: 210px;
      }

      textarea {
        min-height: 320px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
        border-radius: 20px;
      }

      .header {
        margin-bottom: 18px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
        line-height: 1.7;
      }

      .left-panel,
      .right-panel {
        padding: 13px;
        border-radius: 18px;
      }

      .drop-zone {
        min-height: 185px;
        padding: 22px 12px;
        border-radius: 18px;
      }

      .upload-icon {
        font-size: 38px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
        min-height: 50px;
        font-size: 15px;
      }

      textarea {
        min-height: 280px;
        font-size: 14px;
        border-radius: 16px;
      }

      .stats {
        gap: 10px;
      }

      .stat {
        padding: 13px;
      }

      .stat strong {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="container">
      <section class="header">
        <div class="badge">Number Cleaner Tool</div>
        <h1>فلترة الأرقام من أي ملف</h1>
        <p class="subtitle">
          ارفع ملف Excel أو CSV أو TXT، والموقع هيستخرج الأرقام وينضفها ويخلي كل رقم في سطر بدون علامة +.
        </p>
      </section>

      <section class="layout">
        <div class="left-panel">
          <label class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt,.log,.json,.html,.xml" />
            <div class="upload-icon">📁</div>
            <p><strong>اضغط هنا لاختيار ملف</strong></p>
            <p class="small">أو اسحب الملف وحطه هنا</p>
            <p class="small">يدعم Excel / CSV / TXT وأنواع نصية أخرى</p>
          </label>

          <section class="stats">
            <div class="stat">
              <strong id="totalFound">0</strong>
              <span>أرقام تم العثور عليها</span>
            </div>

            <div class="stat">
              <strong id="uniqueFound">0</strong>
              <span>بعد حذف التكرار</span>
            </div>

            <div class="stat">
              <strong id="fileName">---</strong>
              <span>اسم الملف</span>
            </div>
          </section>
        </div>

        <div class="right-panel">
          <section class="actions">
            <button id="copyBtn" disabled>نسخ</button>
            <button id="downloadBtn" disabled>تحميل TXT</button>
            <button id="clearBtn" class="danger" disabled>مسح</button>
          </section>

          <textarea id="output" placeholder="الأرقام هتظهر هنا..." readonly></textarea>

          <div class="status" id="status"></div>
        </div>
      </section>

      <div class="footer">
        ᴄʀᴇᴀᴛᴇᴅ ʙʏ ᴍᴇᴅᴏ
      </div>
    </main>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const output = document.getElementById("output");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusBox = document.getElementById("status");
    const totalFoundBox = document.getElementById("totalFound");
    const uniqueFoundBox = document.getElementById("uniqueFound");
    const fileNameBox = document.getElementById("fileName");

    let cleanedNumbers = [];

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function normalizeNumber(raw) {
      let number = String(raw);

      number = number.replace(/\+/g, "");
      number = number.replace(/[^\d]/g, "");

      return number;
    }

    function extractNumbers(text) {
      const matches = String(text).match(/\+?\d[\d\s().\-_/]{7,}\d/g) || [];

      const all = matches
        .map(normalizeNumber)
        .filter(num => num.length >= 10 && num.length <= 15);

      const unique = [...new Set(all)];

      return { all, unique };
    }

    function shortFileName(name) {
      return name.length > 14 ? name.slice(0, 14) + "..." : name;
    }

    function updateUI(all, unique, name) {
      cleanedNumbers = unique;

      output.value = unique.join("\n");

      totalFoundBox.textContent = all.length;
      uniqueFoundBox.textContent = unique.length;
      fileNameBox.textContent = shortFileName(name);

      const hasNumbers = unique.length > 0;

      copyBtn.disabled = !hasNumbers;
      downloadBtn.disabled = !hasNumbers;
      clearBtn.disabled = false;

      setStatus(hasNumbers ? "تمت الفلترة بنجاح ✅" : "لم يتم العثور على أرقام مناسبة.");
    }

    async function readExcel(file) {
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: "array" });

      let text = "";

      workbook.SheetNames.forEach(sheetName => {
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          raw: false
        });

        rows.forEach(row => {
          text += row.join(" ") + "\n";
        });
      });

      return text;
    }

    async function readText(file) {
      return await file.text();
    }

    async function handleFile(file) {
      if (!file) return;

      setStatus("جاري قراءة الملف...");
      fileNameBox.textContent = shortFileName(file.name);

      try {
        const extension = file.name.split(".").pop().toLowerCase();
        let text = "";

        if (["xlsx", "xls", "csv"].includes(extension)) {
          text = await readExcel(file);
        } else {
          text = await readText(file);
        }

        const { all, unique } = extractNumbers(text);
        updateUI(all, unique, file.name);

      } catch (error) {
        setStatus("حصل خطأ أثناء قراءة الملف. جرّب ملف CSV أو XLSX أو TXT.");
        console.error(error);
      }
    }

    function getNextDownloadName() {
      const currentCount = Number(localStorage.getItem("medoDownloadCount") || "0");
      const nextCount = currentCount + 1;

      localStorage.setItem("medoDownloadCount", String(nextCount));

      return `Medo-${nextCount}.txt`;
    }

    fileInput.addEventListener("change", () => {
      handleFile(fileInput.files[0]);
    });

    dropZone.addEventListener("dragover", e => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");

      const file = e.dataTransfer.files[0];
      handleFile(file);
    });

    copyBtn.addEventListener("click", async () => {
      if (!cleanedNumbers.length) return;

      try {
        await navigator.clipboard.writeText(cleanedNumbers.join("\n"));
        setStatus("تم نسخ الأرقام ✅");
      } catch (error) {
        output.select();
        document.execCommand("copy");
        setStatus("تم نسخ الأرقام ✅");
      }
    });

    downloadBtn.addEventListener("click", () => {
      if (!cleanedNumbers.length) return;

      const fileName = getNextDownloadName();

      const blob = new Blob([cleanedNumbers.join("\n")], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = fileName;

      document.body.appendChild(a);
      a.click();

      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus(`تم تحميل الملف باسم ${fileName} ✅`);
    });

    clearBtn.addEventListener("click", () => {
      cleanedNumbers = [];
      output.value = "";
      fileInput.value = "";

      totalFoundBox.textContent = "0";
      uniqueFoundBox.textContent = "0";
      fileNameBox.textContent = "---";

      copyBtn.disabled = true;
      downloadBtn.disabled = true;
      clearBtn.disabled = true;

      setStatus("");
    });
  </script>
</body>
</html>
