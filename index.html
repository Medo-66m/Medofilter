<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Cleaner</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #1f2937 0, transparent 35%),
        linear-gradient(135deg, #020617, #0f172a);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 26px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      padding: 28px;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.25);
      font-size: 13px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -1px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 10px;
      line-height: 1.7;
      font-size: 15px;
    }

    .drop-zone {
      border: 2px dashed rgba(148, 163, 184, 0.35);
      border-radius: 22px;
      padding: 34px 18px;
      text-align: center;
      background: rgba(2, 6, 23, 0.45);
      transition: 0.2s;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.08);
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .drop-zone p {
      margin: 6px 0;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0;
    }

    .stat {
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      color: #f8fafc;
    }

    .stat span {
      color: #94a3b8;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: 700;
      color: #020617;
      background: #22c55e;
      transition: 0.18s;
      flex: 1;
      min-width: 150px;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.secondary {
      background: #334155;
      color: #e5e7eb;
    }

    button.danger {
      background: #ef4444;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      background: #020617;
      color: #d1fae5;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 16px;
      outline: none;
      line-height: 1.6;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    .status {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      min-height: 24px;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 18px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 18px;
        border-radius: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      textarea {
        min-height: 240px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="header">
      <div class="badge">Number Cleaner Tool</div>
      <h1>فلترة الأرقام من أي ملف</h1>
      <p class="subtitle">
        ارفع ملف Excel أو CSV أو TXT، والموقع هيستخرج الأرقام وينضفها ويخلي كل رقم في سطر بدون علامة +.
      </p>
    </section>

    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt,.log,.json,.html,.xml" />
      <div class="upload-icon">📁</div>
      <p><strong>اضغط هنا لاختيار ملف</strong></p>
      <p class="small">أو اسحب الملف وحطه هنا</p>
    </label>

    <section class="stats">
      <div class="stat">
        <strong id="totalFound">0</strong>
        <span>أرقام تم العثور عليها</span>
      </div>
      <div class="stat">
        <strong id="uniqueFound">0</strong>
        <span>بعد حذف التكرار</span>
      </div>
      <div class="stat">
        <strong id="fileName">---</strong>
        <span>اسم الملف</span>
      </div>
    </section>

    <section class="actions">
      <button id="copyBtn" disabled>نسخ الأرقام</button>
      <button id="downloadBtn" disabled>تحميل TXT</button>
      <button id="clearBtn" class="danger" disabled>مسح</button>
    </section>

    <textarea id="output" placeholder="الأرقام هتظهر هنا..." readonly></textarea>

    <div class="status" id="status"></div>

    <div class="footer">
      المعالجة تتم داخل المتصفح فقط، بدون رفع الملف لأي سيرفر.
    </div>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const output = document.getElementById("output");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusBox = document.getElementById("status");
    const totalFoundBox = document.getElementById("totalFound");
    const uniqueFoundBox = document.getElementById("uniqueFound");
    const fileNameBox = document.getElementById("fileName");

    let cleanedNumbers = [];

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function normalizeNumber(raw) {
      let number = String(raw);

      number = number.replace(/\+/g, "");
      number = number.replace(/[^\d]/g, "");

      return number;
    }

    function extractNumbers(text) {
      const matches = String(text).match(/\+?\d[\d\s().\-_/]{7,}\d/g) || [];

      const all = matches
        .map(normalizeNumber)
        .filter(num => num.length >= 10 && num.length <= 15);

      const unique = [...new Set(all)];

      return { all, unique };
    }

    function updateUI(all, unique, name) {
      cleanedNumbers = unique;

      output.value = unique.join("\n");

      totalFoundBox.textContent = all.length;
      uniqueFoundBox.textContent = unique.length;
      fileNameBox.textContent = name.length > 10 ? name.slice(0, 10) + "..." : name;

      const hasNumbers = unique.length > 0;

      copyBtn.disabled = !hasNumbers;
      downloadBtn.disabled = !hasNumbers;
      clearBtn.disabled = false;

      setStatus(hasNumbers ? "تمت الفلترة بنجاح ✅" : "لم يتم العثور على أرقام مناسبة.");
    }

    async function readExcel(file) {
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: "array" });

      let text = "";

      workbook.SheetNames.forEach(sheetName => {
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });

        rows.forEach(row => {
          text += row.join(" ") + "\n";
        });
      });

      return text;
    }

    async function readText(file) {
      return await file.text();
    }

    async function handleFile(file) {
      if (!file) return;

      setStatus("جاري قراءة الملف...");
      fileNameBox.textContent = file.name.length > 10 ? file.name.slice(0, 10) + "..." : file.name;

      try {
        const extension = file.name.split(".").pop().toLowerCase();
        let text = "";

        if (["xlsx", "xls", "csv"].includes(extension)) {
          text = await readExcel(file);
        } else {
          text = await readText(file);
        }

        const { all, unique } = extractNumbers(text);
        updateUI(all, unique, file.name);

      } catch (error) {
        setStatus("حصل خطأ أثناء قراءة الملف. جرّب ملف CSV أو XLSX أو TXT.");
        console.error(error);
      }
    }

    fileInput.addEventListener("change", () => {
      handleFile(fileInput.files[0]);
    });

    dropZone.addEventListener("dragover", e => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");

      const file = e.dataTransfer.files[0];
      handleFile(file);
    });

    copyBtn.addEventListener("click", async () => {
      if (!cleanedNumbers.length) return;

      await navigator.clipboard.writeText(cleanedNumbers.join("\n"));
      setStatus("تم نسخ الأرقام ✅");
    });

    downloadBtn.addEventListener("click", () => {
      if (!cleanedNumbers.length) return;

      const blob = new Blob([cleanedNumbers.join("\n")], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "cleaned_numbers.txt";
      document.body.appendChild(a);
      a.click();

      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus("تم تحميل ملف TXT ✅");
    });

    clearBtn.addEventListener("click", () => {
      cleanedNumbers = [];
      output.value = "";
      fileInput.value = "";

      totalFoundBox.textContent = "0";
      uniqueFoundBox.textContent = "0";
      fileNameBox.textContent = "---";

      copyBtn.disabled = true;
      downloadBtn.disabled = true;
      clearBtn.disabled = true;

      setStatus("");
    });
  </script>
</body>
</html>
